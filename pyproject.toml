[project]
name = "amaranth-companion"
description = "Visual editor for gateware based on amaranth-lang"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "PyQt5>=5.15",
    "coloredlogs>=15",
]

[project.scripts]
amaranth-companion = "amaranth_companion.__main__:cli"

[project.urls]
Homepage = "https://github.com/cyber-murmel/amaranth-companion"

[dependency-groups]
dev = [
    "pytest>=8",
    "black>=23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# __version__ stays the single source of truth
path = "amaranth_companion/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["amaranth_companion"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
# QT_QPA_PLATFORM is set in tests/conftest.py, which must run before PyQt
# is imported; doing it here would need the pytest-env plugin.
